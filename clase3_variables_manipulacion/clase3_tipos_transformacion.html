# ¿Por qué importan los tipos?

El **tipo** de una variable decide **qué puedes hacer** con ella. No puedes promediar texto ni ordenar categorías si R no sabe que lo son.

&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Tipo&lt;/th&gt;&lt;th&gt;Ejemplo&lt;/th&gt;&lt;th&gt;Qué puedes hacer&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;logical&lt;/code&gt;&lt;/td&gt;&lt;td&gt;TRUE / FALSE&lt;/td&gt;&lt;td&gt;Condiciones, filtros, contar casos&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;integer&lt;/code&gt;&lt;/td&gt;&lt;td&gt;186L&lt;/td&gt;&lt;td&gt;Operaciones con enteros&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;double / numeric&lt;/code&gt;&lt;/td&gt;&lt;td&gt;1.67&lt;/td&gt;&lt;td&gt;Sumar, promediar, comparar&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;character&lt;/code&gt;&lt;/td&gt;&lt;td&gt;"Maipú"&lt;/td&gt;&lt;td&gt;Contar, agrupar, etiquetar&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;factor&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Baja &amp;lt; Media &amp;lt; Alta&lt;/td&gt;&lt;td&gt;Categorías con orden: gráficos y modelos&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;Date&lt;/code&gt;&lt;/td&gt;&lt;td&gt;2024-06-15&lt;/td&gt;&lt;td&gt;Ordenar por tiempo, calcular plazos&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

---
class: middle

# Cómo revisar el tipo

Dos funciones que ya conocemos:

```r
# El tipo de una variable puntual
class(gestion$estado)     # "integer"
class(gestion$comuna)     # "character"

# El panorama completo de la base
glimpse(gestion)
```

.info-box[
Recuerda las abreviaturas de `glimpse()`: `int` = integer, `dbl` = double, `chr` = character, `lgl` = logical, `fct` = factor.
]

---
class: middle

# Cómo cambiar el tipo

R tiene una familia de funciones `as.___()` para **convertir**:

&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Función&lt;/th&gt;&lt;th&gt;Convierte a…&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;as.character()&lt;/code&gt;&lt;/td&gt;&lt;td&gt;texto&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;as.numeric()&lt;/code&gt;&lt;/td&gt;&lt;td&gt;número (con decimales)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;as.integer()&lt;/code&gt;&lt;/td&gt;&lt;td&gt;entero&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;as.logical()&lt;/code&gt;&lt;/td&gt;&lt;td&gt;TRUE / FALSE&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;as.factor()&lt;/code&gt;&lt;/td&gt;&lt;td&gt;factor (categoría)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;as.Date()&lt;/code&gt;&lt;/td&gt;&lt;td&gt;fecha&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

.highlight-box[
**Regla clave:** para que el cambio quede guardado hay que **reasignar** el objeto. No basta `as.factor(gestion$comuna)`; tiene que ser `gestion$comuna &lt;- as.factor(gestion$comuna)`.
]

---
class: middle

# Caso especial: el `factor` ordenado

`nivel_prioridad` es texto, y R lo ordenaría **alfabéticamente** (Alta, Baja, Media). Queremos el orden **lógico**: Baja → Media → Alta.

```r
# 1) lo pasamos a factor
gestion$nivel_prioridad &lt;- as.factor(gestion$nivel_prioridad)

# 2) le damos el orden correcto de niveles
gestion$nivel_prioridad &lt;- factor(gestion$nivel_prioridad,
                                  levels = c("Baja", "Media", "Alta"))

table(gestion$nivel_prioridad)   # ahora aparece Baja, Media, Alta
```

.info-box[
Los factores ordenados son clave para **gráficos** y **modelos**: sin ellos, "Alta" quedaría antes que "Baja" solo por el abecedario.
]

# Bloque 3

# Transformación de variables con `dplyr`

---
class: middle

# Primero: el pipe `%&gt;%`

El **pipe** (`%&gt;%`) encadena acciones sobre un mismo dataframe. Se lee como **"y luego"**.

.two-col[
.card.card-red[
**Sin pipe**
```r
gestion2 &lt;- select(gestion,
                   comuna, monto_asignado)
gestion2 &lt;- filter(gestion2,
                   monto_asignado &gt; 0)
```
]
.card.card-green[
**Con pipe**
```r
gestion2 &lt;- gestion %&gt;%
  select(comuna, monto_asignado) %&gt;%
  filter(monto_asignado &gt; 0)
```
]
]

.info-box[
El pipe toma lo que está a la izquierda y lo pasa como primer argumento a la función de la derecha. Hace el código **más legible** y ordenado.
]

---
class: middle

# `select()` — elegir columnas

Sirve para quedarnos solo con las variables que nos interesan:

```r
# quedarnos con algunas columnas
gestion %&gt;%
  dplyr::select(comuna, tipo_solicitud, oficina_municipal, monto_asignado)

# quitar una columna con el signo menos
gestion %&gt;%
  dplyr::select(-id_solicitud)
```

.info-box[
Útil cuando la base es enorme (¡R consume mucha memoria!) o simplemente para trabajar más ordenados con las variables que necesitamos.
]

---
class: middle

# `filter()` — elegir filas

Selecciona **observaciones** que cumplen una condición:

```r
# solicitudes ingresadas por personas naturales
gestion %&gt;% dplyr::filter(tipo_solicitante == "Persona natural")

# solicitudes con presupuesto sobre 10 millones
gestion %&gt;% dplyr::filter(monto_asignado &gt; 10000000)
```

.definition-box[
`filter()` conserva las filas donde la condición es **verdadera** (`TRUE`). Para escribir condiciones precisas necesitamos los **operadores lógicos**.
]

---
class: middle

# Operadores lógicos

&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Operador&lt;/th&gt;&lt;th&gt;Significado&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;==&lt;/code&gt;&lt;/td&gt;&lt;td&gt;es igual a&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;!=&lt;/code&gt;&lt;/td&gt;&lt;td&gt;es diferente a&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;&amp;gt;&lt;/code&gt; &amp;nbsp; &lt;code&gt;&amp;lt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;mayor que / menor que&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;&amp;gt;=&lt;/code&gt; &amp;nbsp; &lt;code&gt;&amp;lt;=&lt;/code&gt;&lt;/td&gt;&lt;td&gt;mayor o igual / menor o igual&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;&amp;amp;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;intersección (y)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;|&lt;/code&gt;&lt;/td&gt;&lt;td&gt;unión (o)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;code&gt;%in%&lt;/code&gt;&lt;/td&gt;&lt;td&gt;está contenido en…&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;

.footnote-small[Tabla basada en tu material de RPubs y en *AnalizaR Datos Políticos* (Urdinez &amp; Cruz).]

---
class: middle

# `filter()` con condiciones combinadas

```r
# prioridad alta Y que no estén rechazadas
gestion %&gt;%
  dplyr::filter(nivel_prioridad == "Alta" &amp; estado != 4)

# varias comunas a la vez
gestion %&gt;%
  dplyr::filter(comuna %in% c("Maipú", "La Florida", "Puente Alto"))
```

.info-box[
Traducción de la primera: *"quédate con las solicitudes de prioridad Alta **y** cuyo estado sea distinto de 4 (rechazada)"*. Con `&amp;` (y), `|` (o) y `%in%` armamos filtros tan precisos como necesitemos.
]

---
class: middle

# `mutate()` — crear o transformar columnas

Genera variables nuevas a partir de las que ya existen:

```r
gestion &lt;- gestion %&gt;%
  dplyr::mutate(monto_millones = monto_asignado / 1000000,
                costo_beneficiario = monto_asignado / n_beneficiarios)
```

.definition-box[
`mutate()` **agrega** columnas al dataframe sin borrar las demás. Acá creamos el monto en millones y el costo por persona beneficiada.
]

---
class: middle

# `case_when()` — recodificar por condiciones

Ideal para pasar **códigos numéricos a etiquetas** legibles:

```r
gestion &lt;- gestion %&gt;%
  dplyr::mutate(estado_txt = case_when(
    estado == 1 ~ "Ingresada",
    estado == 2 ~ "En proceso",
    estado == 3 ~ "Resuelta",
    estado == 4 ~ "Rechazada"))
```

--

También sirve para **crear un `logical`** desde "Sí"/"No":

```r
gestion &lt;- gestion %&gt;%
  dplyr::mutate(visita_log = requiere_visita == "Sí")
```

.footnote-small[Cada línea de `case_when()` se lee: *condición* `~` *valor que asigna*. Se evalúan en orden, de arriba hacia abajo.]

# Ejercicios

.definition-box[
**1. Reclasificar.** Convierte `comuna`, `tipo_solicitante`, `tipo_solicitud` y `oficina_municipal` a **factor**. Convierte `nivel_prioridad` a **factor ordenado** (Baja → Media → Alta).
]

.definition-box[
**2. Recodificar.** Crea `estado_txt` con `case_when()` (etiquetas del estado) y `visita_log` (logical) a partir de `requiere_visita`.
]

.definition-box[
**3. Filtrar.** Quédate con las solicitudes de prioridad **Alta**, que **no** estén rechazadas y con `monto_asignado` mayor a 5.000.000.
]

.definition-box[
**4. Crear y seleccionar.** Con `mutate()` crea `costo_beneficiario = monto_asignado / n_beneficiarios` y luego usa `select()` para quedarte solo con `comuna`, `tipo_solicitud` y esa nueva variable.
]
